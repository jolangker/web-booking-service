name: booking-${APP_ENV:?Set APP_ENV}
x-runtime: &runtime
  APP_ENV: ${APP_ENV:?Set APP_ENV}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  HEALTH_TOKEN: ${HEALTH_TOKEN:?Set HEALTH_TOKEN}
  WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
  WAHA_BASE_URL: https://${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN}
  DEBUG_RUNTIME: "false"
services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:?Set ACME email or internal for local smoke}
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases: ["${GATEWAY_DOMAIN}"]
    depends_on:
      web: { condition: service_healthy }
      waha: { condition: service_healthy }
  web:
    image: booking-web:scaffold
    build: { context: .., dockerfile: infra/Dockerfile.web }
    restart: unless-stopped
    environment: *runtime
    volumes: ["invoices:/app/storage/invoices:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{headers:{'x-runtime-token':process.env.HEALTH_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 20s
  worker:
    image: booking-worker:scaffold
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    restart: unless-stopped
    stop_grace_period: 25s
    environment:
      <<: *runtime
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "3002"
    volumes: ["invoices:/app/storage/invoices"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready',{headers:{'x-runtime-token':process.env.HEALTH_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 10
  postgres:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  waha:
    image: devlikeapro/waha:noweb-2026.10.1@sha256:0d64cce14a922f61bb9a620474086d1f5695f2522e7e1088704e6eca3a085d0c
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes: ["waha_sessions:/app/.sessions"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/sessions',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  postgres_data:
  waha_sessions:
  invoices:
  caddy_data:
  caddy_config:
